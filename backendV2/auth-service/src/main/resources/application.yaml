server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/eventplatform_auth?currentSchema=app,public
    username: eventplatform
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: app
    default-schema: app
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    expiration-minutes: 60
    issuer: eventplatform
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-client-id.apps.googleusercontent.com}