name: eventplatform

services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventplatform
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventplatform_auth
    ports:
      - "5433:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
      - ./auth-service/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventplatform -d eventplatform_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-booking:
    image: postgres:16-alpine
    container_name: booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventplatform
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventplatform_booking
    ports:
      - "5434:5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
      - ./booking-service/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventplatform -d eventplatform_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payment:
    image: postgres:16-alpine
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventplatform
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventplatform_payment
    ports:
      - "5435:5432"
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
      - ./payment-service/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventplatform -d eventplatform_payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventplatform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: eventplatform-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"      
      - "8025:8025"     
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  auth_pgdata:
  booking_pgdata:
  payment_pgdata:
  rabbitmq_data:
