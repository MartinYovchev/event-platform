server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5434/eventplatform_booking?currentSchema=app,public
    username: eventplatform
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: app
    default-schema: app
    baseline-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/oauth2/jwks

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  # Currency sent to payment-service when creating a Stripe checkout for a paid event.
  currency: ${PAYMENT_CURRENCY:eur}
  # HMAC secret used to sign/verify the QR check-in token. Lives only in booking-service
  # (it both mints the token at confirmation and verifies it at the door). Override in prod.
  checkin:
    secret: ${CHECKIN_SECRET:change-me-dev-only-checkin-secret-please-override-0123456789}
    grace-hours: ${CHECKIN_GRACE_HOURS:6}