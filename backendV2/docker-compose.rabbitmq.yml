# Shared message broker for the backendV2 microservices.
# auth-service publishes UserDeleted; payment-service publishes Payment events;
# booking-service consumes both. Start with: docker compose -f docker-compose.rabbitmq.yml up -d
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventplatform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
volumes:
  rabbitmq_data:
